[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goldpulse-telegram-bot"
version = "0.1.0"
description = "A Telegram bot that delivers the current global gold spot price (XAU) to subscribed users every two minutes."
requires-python = ">=3.11"
authors = [{ name = "GoldPulse Bot maintainer" }]
readme = "README.md"

[project.dependencies]
"python-telegram-bot[job-queue]" = "==22.2"
httpx = ">=0.27,<0.29"
python-dotenv = "==1.1.1"

[project.scripts]
goldpulse = "goldpulse_bot.bot:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
